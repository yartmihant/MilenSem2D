[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-model"
version = "0.1.0"
description = "Parser and data model for Fidesys .fc files"
requires-python = ">=3.8"
authors = [
    {name = "Artem Antonov", email = "artem@example.com"},
]
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fc_model*"]

[tool.setuptools.package-data]
fc_model = ["py.typed"]
